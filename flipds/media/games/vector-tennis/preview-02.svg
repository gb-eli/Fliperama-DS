<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="Prévia dos modos e estratégias do Vector Tennis">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071126"/><stop offset="1" stop-color="#100b27"/></linearGradient></defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <text x="54" y="60" fill="#f7fbff" font-family="monospace" font-size="30" font-weight="800">VECTOR TENNIS · MODOS</text>
  <text x="56" y="89" fill="#49e7ff" font-family="monospace" font-size="15">CONTROLES, META E COMPORTAMENTO DA CPU EXPLICADOS</text>
  <g font-family="Arial,system-ui">
    <g transform="translate(54 124)"><rect width="258" height="332" rx="22" fill="#081528" stroke="#49e7ff" stroke-opacity=".55"/><text x="24" y="42" fill="#49e7ff" font-size="18" font-weight="800">VS CPU</text><text x="24" y="76" fill="#f7fbff" font-size="23" font-weight="800">3 · 5 · 7 pontos</text><text x="24" y="116" fill="#aebed4" font-size="16">Iniciante</text><text x="24" y="145" fill="#aebed4" font-size="16">Normal</text><text x="24" y="174" fill="#aebed4" font-size="16">Desafio</text><text x="24" y="203" fill="#ffd166" font-size="16">Surpresa aleatória</text><path d="M24 232h210" stroke="#29445f"/><text x="24" y="267" fill="#f7fbff" font-size="15">Reação variável</text><text x="24" y="294" fill="#f7fbff" font-size="15">Erro probabilístico</text><text x="24" y="321" fill="#f7fbff" font-size="15">Mira atualizada por decisão</text></g>
    <g transform="translate(350 124)"><rect width="258" height="332" rx="22" fill="#0d1229" stroke="#a46fff" stroke-opacity=".6"/><text x="24" y="42" fill="#a46fff" font-size="18" font-weight="800">2 JOGADORES</text><text x="24" y="76" fill="#f7fbff" font-size="23" font-weight="800">Mesmo dispositivo</text><text x="24" y="122" fill="#49e7ff" font-size="16" font-weight="700">JOGADOR 1</text><text x="24" y="151" fill="#d8e6f5" font-size="17">W / S</text><text x="24" y="201" fill="#a46fff" font-size="16" font-weight="700">JOGADOR 2</text><text x="24" y="230" fill="#d8e6f5" font-size="17">↑ / ↓</text><path d="M24 258h210" stroke="#3d315f"/><text x="24" y="292" fill="#f7fbff" font-size="15">Toque: botões J1 e J2</text><text x="24" y="319" fill="#f7fbff" font-size="15">Espaço: sacar</text></g>
    <g transform="translate(646 124)"><rect width="258" height="332" rx="22" fill="#101426" stroke="#ffd166" stroke-opacity=".6"/><text x="24" y="42" fill="#ffd166" font-size="18" font-weight="800">PERFIS DA CPU</text><text x="24" y="86" fill="#f7fbff" font-size="17">Ofensiva</text><text x="24" y="118" fill="#aebed4" font-size="14">antecipa o rebote</text><text x="24" y="164" fill="#f7fbff" font-size="17">Defensiva</text><text x="24" y="196" fill="#aebed4" font-size="14">protege o centro</text><text x="24" y="242" fill="#f7fbff" font-size="17">Posicional</text><text x="24" y="274" fill="#aebed4" font-size="14">fecha o melhor ângulo</text><text x="24" y="316" fill="#f7fbff" font-size="17">Imprevisível</text></g>
  </g>
  <text x="480" y="505" text-anchor="middle" fill="#9eb1cc" font-family="monospace" font-size="14">A QUALIDADE GRÁFICA MUDA O ACABAMENTO, NÃO AS REGRAS NEM A IA</text>
</svg>
