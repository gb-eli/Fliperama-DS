<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#070b17" />
  <title>Diagnóstico · Fliperama DS v0.34.1</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#050912;color:#ecf5ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#10274a 0,#070b17 42%,#03050a 100%)}
    main{width:min(980px,calc(100% - 28px));margin:0 auto;padding:40px 0 64px}header,.card{background:#0a1424dd;border:1px solid #29466d;border-radius:22px;box-shadow:0 24px 80px #0007}
    header{padding:26px}.eyebrow{color:#7de7ff;font-weight:900;letter-spacing:.12em;margin:0}.lead{color:#b8c9dd;max-width:70ch}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:18px}.card{padding:18px}.card h2{font-size:1rem;margin:0 0 12px}.status{display:flex;gap:10px;align-items:flex-start}.dot{width:12px;height:12px;margin-top:5px;border-radius:50%;background:#70829a;box-shadow:0 0 16px currentColor}.ok .dot{background:#68f0a6}.warn .dot{background:#ffd56a}.fail .dot{background:#ff7b8d}.pending .dot{background:#7de7ff}
    .status p{margin:0;color:#c8d6e8}.status strong{display:block;color:#fff;margin-bottom:3px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}a,button{appearance:none;border:0;border-radius:12px;padding:11px 15px;font-weight:850;text-decoration:none;cursor:pointer;background:#dff8ff;color:#07101c}a.secondary{background:#172941;color:#dff3ff;border:1px solid #355a85}code{color:#7de7ff}small{color:#8fa6c0}
  </style>
</head>
<body>
<main>
  <header>
    <p class="eyebrow">FLIPERAMA DS · FASE 7.14</p>
    <h1>Diagnóstico técnico v0.34.1 · CPU e multiplayer</h1>
    <p class="lead">Esta página verifica os arquivos essenciais, recursos do navegador e o ambiente de publicação. Ela não altera jogos nem dados salvos.</p>
    <div class="actions"><a href="./">Abrir o Fliperama</a><a class="secondary" href="./diagnostico-jogos.html">Diagnóstico dos jogos</a><button id="rerun">Executar novamente</button></div>
  </header>
  <section id="results" class="grid" aria-live="polite"></section>
</main>
<script>
(() => {
  const requiredFiles = ['./index.html','./app.js','./app.css','./phaser.js','./version.json','./manifest.webmanifest','./icons/fliperama-ds.svg','./games/voxelcraft-ds/index.html','./games/voxelcraft-ds/vendor/three/three.module.min.js','./diagnostico-jogos.html','./validation/game-audit-results.json','./validation/three-d-test-results.json','./validation/voxelcraft-test-results.json','./museum/data/catalog.json','./museum/viewer/museum-viewer.js','./validation/museum-timeline-test-results.json','./education/game-learning.json','./validation/educational-content-test-results.json'];
  const results = document.querySelector('#results');
  const card = (title, state, message) => `<article class="card ${state}"><h2>${title}</h2><div class="status"><span class="dot"></span><p>${message}</p></div></article>`;
  async function testFetch(path) {
    try {
      const response = await fetch(`${path}${path.includes('?')?'&':'?'}t=${Date.now()}`, {cache:'no-store'});
      return response.ok ? {ok:true, detail:`HTTP ${response.status}`} : {ok:false, detail:`HTTP ${response.status}`};
    } catch (error) {
      return {ok:false, detail:error instanceof Error ? error.message : String(error)};
    }
  }
  async function testIndexedDB() {
    if (!('indexedDB' in window)) return {ok:false, detail:'API não suportada; a plataforma usará o fallback.'};
    return await new Promise((resolve) => {
      const name = `fliperama-ds-diagnostic-${Date.now()}`;
      const request = indexedDB.open(name, 1);
      request.onupgradeneeded = () => request.result.createObjectStore('test');
      request.onsuccess = () => { request.result.close(); indexedDB.deleteDatabase(name); resolve({ok:true,detail:'Leitura e criação disponíveis.'}); };
      request.onerror = () => resolve({ok:false,detail:request.error?.message || 'Falha desconhecida.'});
      request.onblocked = () => resolve({ok:false,detail:'Banco bloqueado por outra aba.'});
    });
  }
  async function run() {
    results.innerHTML = card('Ambiente','pending','Executando verificações…');
    const protocolOk = location.protocol === 'https:' || ['localhost','127.0.0.1'].includes(location.hostname);
    let html = card('Protocolo', protocolOk ? 'ok' : 'warn', `<strong>${location.protocol}</strong>${location.protocol === 'file:' ? 'Use um servidor local: módulos JavaScript, Service Worker e consultas HTTP não são garantidos em file://.' : 'Ambiente compatível com PWA e atualização de cache.'}`);
    const fileResults = await Promise.all(requiredFiles.map(async path => [path, await testFetch(path)]));
    const missing = fileResults.filter(([,result]) => !result.ok);
    html += card('Arquivos essenciais', missing.length ? 'fail':'ok', missing.length ? `<strong>${missing.length} falha(s)</strong>${missing.map(([path,result])=>`<code>${path}</code>: ${result.detail}`).join('<br>')}` : `<strong>${requiredFiles.length} arquivos responderam</strong>Estrutura principal íntegra no servidor atual.`);
    const museumTest = await testFetch('./validation/museum-timeline-test-results.json');
    html += card('Museu e linha do tempo', museumTest.ok ? 'ok':'warn', museumTest.ok ? '<strong>62 verificações estruturais disponíveis</strong>Biblioteca 2D, visualizador 360° sob demanda, pipeline GLB/glTF e percurso guiado foram validados.' : `<strong>Resultado não carregado</strong>${museumTest.detail}`);
    const educationTest = await testFetch('./validation/educational-content-test-results.json');
    html += card('Conteúdo educacional', educationTest.ok ? 'ok':'warn', educationTest.ok ? '<strong>120 verificações disponíveis</strong>As 18 experiências possuem progressão, modos, dificuldades, gráficos, história, curiosidades e exemplos de código.' : `<strong>Resultado não carregado</strong>${educationTest.detail}`);
    const canvas = document.createElement('canvas');
    const webgl2 = canvas.getContext('webgl2');
    const webgl = webgl2 || canvas.getContext('webgl');
    html += card('Renderização 3D', webgl ? 'ok':'fail', webgl ? `<strong>${webgl2?'WebGL 2':'WebGL 1'}</strong>Experiências gráficas podem iniciar; a qualidade dependerá do dispositivo.` : '<strong>WebGL indisponível</strong>Jogos 3D deverão usar o fallback ou exibir aviso.');
    const idb = await testIndexedDB();
    html += card('Armazenamento', idb.ok ? 'ok':'warn', `<strong>${idb.ok?'IndexedDB disponível':'Fallback necessário'}</strong>${idb.detail} O VoxelCraft também dispõe de localStorage e memória temporária.`);
    const swState = 'serviceWorker' in navigator ? (navigator.serviceWorker.controller ? 'Ativo nesta página' : 'Suportado; poderá ativar após recarregar') : 'Não suportado';
    html += card('Service Worker', 'serviceWorker' in navigator ? 'ok':'warn', `<strong>${swState}</strong>Cache identificado pela versão 0.34.1 e limpeza das versões antigas.`);
    html += card('Dispositivo','ok',`<strong>${navigator.hardwareConcurrency || '?'} núcleos lógicos · DPR ${window.devicePixelRatio || 1}</strong><small>${navigator.userAgent}</small>`);
    results.innerHTML = html;
  }
  document.querySelector('#rerun').addEventListener('click', run);
  run();
})();
</script>
</body>
</html>
